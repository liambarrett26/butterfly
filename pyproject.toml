[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "butterfly"
dynamic = ["version"]
description = "Local highlight reels from GoPro footage"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Liam Barrett" }]
# The exact pins below (numpy 2.5, scipy 1.18, librosa 1.0) need Python 3.12+.
requires-python = ">=3.12"
dependencies = [
    "telemetrik==0.1.0",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "opencv-python-headless==4.14.0.94",
    "pillow==12.3.0",
]

[project.optional-dependencies]
vision = ["torch==2.14.1", "open_clip_torch==3.3.0"]
music = ["librosa==1.0.0"]
photos = ["pillow-heif==1.8.1"]
audio = ["torch==2.14.1", "transformers==5.19.0"]
people = ["pyobjc-framework-Vision==12.2.2; sys_platform == 'darwin'"]
all = ["butterfly[vision,music,photos,audio,people]"]

[project.scripts]
butterfly = "butterfly.cli:main"
butterfly-eval = "butterfly.evaluate:main"
butterfly-review = "butterfly.review:main"
butterfly-train = "butterfly.ranker:main"

[tool.setuptools.dynamic]
version = { attr = "butterfly.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
